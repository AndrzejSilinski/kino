# Stos deweloperski Etapu 5:
#   aplikacja: php (FPM), worker (kolejka), scheduler (harmonogram) — jeden obraz
#   infrastruktura: nginx, postgres, redis, mailpit
# Etap 6: reverb (WebSocket, Laravel Reverb) — publikacja z PHP, klienci przez nginx.
# Etap 8: SPA klienta (Vue) — nginx serwuje frontend/dist; serwer Vite w profilu dev.

# ----------------------------------------------------------------------
# Wspólna definicja kontenerów z kodem aplikacji.
#
# Jeden obraz, trzy role. Kotwica YAML (&php-app) i scalenie (<<: *php-app)
# usuwają trzy kopie tej samej konfiguracji: zmiana wolumenu albo sieci
# w jednym miejscu obejmuje wszystkie trzy kontenery.
#
# UWAGA: scalenie jest PŁYTKIE. Kontener, który nadpisuje depends_on,
# musi powtórzyć całą listę zależności, a nie tylko dopisać nową.
# ----------------------------------------------------------------------
x-php-app: &php-app
  build:
    context: ./docker/php
  image: cinema/php:dev
  restart: unless-stopped
  volumes:
    # Bind mount: host code is visible inside the container.
    # Editing a file on the host takes effect immediately.
    - ./backend:/var/www/html
    # Etap 7, blok F: limity wysyłania plików (plakaty). Tylko do odczytu.
    # Po zmianie: up -d --force-recreate tych kontenerów + restart nginx (opis w pliku).
    - ./docker/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - cinema

services:
  # ------------------------------------------------------------------
  # PHP-FPM - obsługuje żądania HTTP przekazywane przez nginx
  # ------------------------------------------------------------------
  php:
    <<: *php-app
    container_name: cinema_php

  # ------------------------------------------------------------------
  # Queue worker - wykonuje zadania z kolejki Redis (PDF, mail, push)
  #
  # user 82:82 — ten sam użytkownik co pule php-fpm (www-data w Alpine).
  #   Pliki tworzone przez workera i przez żądania HTTP mają jednego
  #   właściciela, więc nie powstaje mieszanka plików roota i www-data.
  # --timeout=60 — twardy limit jednego zadania. MUSI być mniejszy niż
  #   REDIS_QUEUE_RETRY_AFTER (90 s), inaczej Redis odda wciąż trwające
  #   zadanie drugiemu procesowi i wykona się ono dwa razy.
  # --tries=3 — wartość awaryjna dla zadań, które nie deklarują własnej
  #   polityki ponowień. Nasze joby deklarują ją same (RetryPolicy).
  # --max-time=3600 — proces kończy się co godzinę i restartuje go Docker;
  #   chroni to przed powoli rosnącym zużyciem pamięci.
  # stop_grace_period — docker stop wysyła SIGTERM i czeka. Worker kończy
  #   bieżące zadanie (wymaga pcntl) zamiast przerywać je w połowie.
  #
  # PUŁAPKA: worker trzyma kod w pamięci. Po zmianie klasy joba trzeba
  # zrestartować kontener: docker compose restart worker
  # ------------------------------------------------------------------
  worker:
    <<: *php-app
    container_name: cinema_worker
    user: "82:82"
    command: >-
      php artisan queue:work redis
      --queue=default
      --tries=3
      --timeout=60
      --sleep=3
      --max-time=3600
    stop_grace_period: 75s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  # ------------------------------------------------------------------
  # Scheduler - uruchamia harmonogram z routes/console.php co minutę
  #
  # schedule:work to pętla w pierwszym planie: co minutę woła schedule:run.
  # Zastępuje wpis w crontabie, którego w kontenerze nie ma. Bez tego
  # kontenera harmonogram istnieje tylko na papierze — schedule:list go
  # pokazuje, ale nikt go nie wykonuje.
  # ------------------------------------------------------------------
  scheduler:
    <<: *php-app
    container_name: cinema_scheduler
    user: "82:82"
    command: php artisan schedule:work
    environment:
      # Pułapka V: bez tego wyjście zaplanowanych komend (także ich logi na
      # stderr) ląduje w /dev/null. /proc/1/fd/2 to stderr procesu głównego
      # kontenera, czyli dokładnie to, co pokazuje docker logs.
      SCHEDULE_OUTPUT: /proc/1/fd/2

  # ------------------------------------------------------------------
  # Reverb - serwer WebSocket (Etap 6)
  #
  # Ten sam obraz i kod co php, worker i scheduler (kotwica), inna rola:
  # `php artisan reverb:start` to długo działający proces na pętli zdarzeń
  # ReactPHP. Adres i port bierze z REVERB_SERVER_HOST i REVERB_SERVER_PORT.
  #
  # Bez sekcji ports: przeglądarka i telefon łączą się przez nginx
  # (ws://localhost:8080/app/...), a kontenery PHP publikują zdarzenia
  # prosto na http://reverb:8080 w sieci cinema. HTTP API Reverba
  # (/apps/...) nie jest wystawione na zewnątrz.
  #
  # user 82:82 — jak worker i scheduler; proces nie potrzebuje roota.
  # healthcheck — Reverb ma własny endpoint GET /up. Pytamy go PHP-em,
  #   bo obraz nie musi zawierać curla. Port 8080 = REVERB_SERVER_PORT.
  #
  # PUŁAPKA (jak N): proces trzyma konfigurację w pamięci. Po zmianie
  # REVERB_* w .env: docker compose restart reverb
  # ------------------------------------------------------------------
  reverb:
    <<: *php-app
    container_name: cinema_reverb
    user: "82:82"
    command: php artisan reverb:start
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------
  # Nginx - HTTP server, the only publicly exposed container
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: cinema_nginx
    restart: unless-stopped
    ports:
      - "8080:80"   # application available at http://localhost:8080
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Etap 8: SPA z frontend/dist. Montujemy CAŁY katalog frontend/, a nie dist/:
      # brakujący katalog wolumenu Docker tworzy jako root i "npm run build"
      # nie mógłby potem do niego pisać.
      - ./frontend:/var/www/frontend:ro
    depends_on:
      - php
    networks:
      - cinema

  # ------------------------------------------------------------------
  # Frontend - serwer deweloperski Vite (Etap 8), TYLKO w profilu "dev":
  #   docker compose --profile dev up -d frontend    ->  http://localhost:5173
  #
  # Zwykłe "docker compose up" go nie uruchamia: SPA "jak produkcja" serwuje
  # nginx z frontend/dist (npm run build) pod http://localhost:8080.
  # Vite przekazuje /api/, /storage/ i WebSocket /app/ do nginx (vite.config.ts),
  # więc dla przeglądarki to jeden origin — bez CORS.
  #
  # Obraz Node przypięty po digeście (pułapka W), ten sam co w tools/.
  # user — pliki w frontend/ (node_modules, dist) należą do użytkownika WSL (zasada 6);
  #   inny UID niż 1000: FRONTEND_UID i FRONTEND_GID w środowisku powłoki.
  # npm ci tylko po zmianie package-lock.json (suma w node_modules/.etap8-lock);
  #   --ignore-scripts: skrypty instalacyjne zależności się nie wykonują.
  # ------------------------------------------------------------------
  frontend:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    container_name: cinema_frontend
    profiles: ["dev"]
    user: "${FRONTEND_UID:-1000}:${FRONTEND_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      VITE_PROXY_TARGET: http://nginx
    command: >-
      sh -c "sha256sum package-lock.json > /tmp/lock.sha
      && (cmp -s /tmp/lock.sha node_modules/.etap8-lock
      || (npm ci --ignore-scripts --no-fund --no-audit && cp /tmp/lock.sha node_modules/.etap8-lock))
      && exec npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - nginx
    networks:
      - cinema

  # ------------------------------------------------------------------
  # PostgreSQL - primary datastore
  # Chosen over MySQL for PARTIAL UNIQUE INDEXES
  # (UNIQUE ... WHERE released_at IS NULL), which the seat locking
  # mechanism relies on to enforce exclusivity at the database level.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cinema_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"   # host access for GUI clients (pgAdmin, DBeaver)
    volumes:
      # Named volume - data survives `docker compose down`
      - pgdata:/var/lib/postgresql/data
      # Skrypty wykonywane przy pierwszej inicjalizacji wolumenu (tworzą bazę testową)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cinema

  # ------------------------------------------------------------------
  # Redis - cache, sesje i kolejka zadań
  # appendonly yes (AOF): zakolejkowane zadania przeżywają restart Redisa,
  # tracimy najwyżej ostatnią sekundę zapisów.
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cinema_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cinema

  # ------------------------------------------------------------------
  # Mailpit - przechwytuje całą pocztę wysyłaną przez aplikację
  #
  # Następca Mailhoga (nierozwijanego od 2020 r.): te same porty,
  # rozwijany na bieżąco. Nic nie wychodzi do prawdziwych skrzynek.
  # Port SMTP 1025 NIE jest wystawiony na zewnątrz — potrzebują go tylko
  # kontenery w sieci cinema. Na zewnątrz wystawiamy wyłącznie interfejs.
  # ------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: cinema_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # interfejs WWW: http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500
    networks:
      - cinema

volumes:
  pgdata:
  redisdata:

networks:
  cinema:
    driver: bridge
