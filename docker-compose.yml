# Stage 0 - minimal stack: PHP + Nginx + PostgreSQL + Redis.
# Later stages add: queue worker, scheduler, Reverb, Mailhog, RabbitMQ.

services:
  # ------------------------------------------------------------------
  # PHP-FPM - runs all application code
  # ------------------------------------------------------------------
  php:
    build:
      context: ./docker/php
    container_name: cinema_php
    restart: unless-stopped
    volumes:
      # Bind mount: host code is visible inside the container.
      # Editing a file on the host takes effect immediately.
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cinema

  # ------------------------------------------------------------------
  # Nginx - HTTP server, the only publicly exposed container
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: cinema_nginx
    restart: unless-stopped
    ports:
      - "8080:80"   # application available at http://localhost:8080
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - cinema

  # ------------------------------------------------------------------
  # PostgreSQL - primary datastore
  # Chosen over MySQL for PARTIAL UNIQUE INDEXES
  # (UNIQUE ... WHERE released_at IS NULL), which the seat locking
  # mechanism relies on to enforce exclusivity at the database level.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cinema_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"   # host access for GUI clients (pgAdmin, DBeaver)
    volumes:
      # Named volume - data survives `docker compose down`
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cinema

  # ------------------------------------------------------------------
  # Redis - cache, sessions, later: queues and broadcasting
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cinema_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cinema

volumes:
  pgdata:
  redisdata:

networks:
  cinema:
    driver: bridge
