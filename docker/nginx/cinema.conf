# Etap 10, blok E: wspólna część obu serwerów (HTTP :80 i HTTPS :443) z default.conf —
# lokacje, CSP, przekazanie do PHP-FPM i Reverba. Dołączana przez include na poziomie server{}.
# Plik jest w obrazie cinema/nginx:dev (docker/nginx/Dockerfile); po zmianie:
#   docker compose up -d --build --force-recreate nginx

    # Laravel exposes ONLY the public/ directory to the outside world.
    # Application code and .env live one level up, out of reach.
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Etap 10, blok F2: Strict-Transport-Security — w obrazie prod plik zawiera nagłówek HSTS,
    # w dev jest pusty (HSTS na localhost psuje http://localhost:8080, decyzja 403). Dołączany
    # TAKŻE w każdej lokacji z własnym add_header niżej: add_header w lokacji zastępuje wszystkie
    # nagłówki z poziomu server, więc bez tego dokument SPA i zasoby wychodziłyby bez HSTS.
    include /etc/nginx/cinema/hsts.conf;

    # Resolver DNS Dockera. Potrzebny, bo adres Reverba (niżej) jest w zmiennej:
    # nginx rozwiązuje go przy każdym żądaniu, a nie raz przy starcie.
    # Skutek: nginx wstaje i obsługuje API także wtedy, gdy kontenera reverb
    # nie ma — zamiast "host not found in upstream" i leżącego całego serwisu.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── WebSocket: Laravel Reverb (Etap 6) ─────────────────────────────
    # Klient (Vue, Flutter) łączy się z ws://localhost:8080/app/{REVERB_APP_KEY}.
    # To jedyna ścieżka Reverba wystawiona na zewnątrz. HTTP API do publikacji
    # zdarzeń (/apps/...) zna tylko sieć Dockera — trafia tu do Laravela i 404.
    #
    # ^~ — prefiks wygrywa z lokacjami regex niżej (\.php$, pliki z kropką).
    location ^~ /app/ {
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;

        # Upgrade HTTP -> WebSocket wymaga HTTP/1.1 i jawnego przekazania
        # nagłówków hop-by-hop, których nginx domyślnie nie przepuszcza.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Domyślne 60 s zamknęłoby cichy kanał. Klient pinguje co
        # activity_timeout (30 s), więc 120 s daje zapas na słabe łącze.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Laravel: API, panel, dokumentacja (Etap 8, blok C) ─────────────
    # Od Etapu 8 adres główny należy do SPA (Vue), a Laravel dostaje tylko swoje
    # prefiksy — lista z "php artisan route:list" (rozpoznanie Etapu 8). NOWY PREFIKS
    # TRAS LARAVELA TRZEBA DOPISAĆ TUTAJ, inaczej trafi do SPA i skończy się jej 404.
    # livewire-<hash>: Livewire 4 wersjonuje ścieżkę skryptów hashem zależnym od wersji pakietu.
    # Nieistniejący plik -> index.php, czyli routing Laravela (jak dotychczas w location /).
    location ~ ^/(api|admin|docs|_scramble|sanctum|livewire-[0-9a-f]+)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Pliki statyczne z backend/public: zasoby panelu (Etap 7) i plakaty spod /storage.
    location ^~ /vendor/  { try_files $uri =404; }
    location ^~ /js/      { try_files $uri =404; }
    location ^~ /storage/ { try_files $uri =404; }

    # ─── SPA klienta (Vue, Etap 8) ──────────────────────────────────────
    # frontend/dist z "npm run build"; katalog frontend/ zamontowany tylko do odczytu.
    # Każda inna ścieżka dostaje index.html (fallback historii): o 404 rozstrzyga router Vue.
    # Bez $uri/ — dla "/" nginx szukałby index.php w dist zamiast oddać index.html.
    location / {
        root /var/www/frontend/dist;
        try_files $uri /index.html;
    }

    # Pliki z hashem w nazwie: nowa wersja ma nową nazwę, więc cache może trwać rok.
    location ^~ /assets/ {
        root /var/www/frontend/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/cinema/hsts.conf;
    }

    # Service worker powiadomień push (blok L): stała nazwa bez hasha, więc bez długiego cache —
    # przeglądarka i tak sprawdza aktualizację SW, ale nginx nie może jej tego utrudniać.
    location = /firebase-messaging-sw.js {
        root /var/www/frontend/dist;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        include /etc/nginx/cinema/hsts.conf;
    }

    # Dokument SPA: zawsze sprawdzany na nowo (inaczej przeglądarka trzymałaby odwołania
    # do usuniętych plików z /assets/) i z nagłówkami bezpieczeństwa. add_header w lokacji
    # zastępuje nagłówki z poziomu server — dlatego komplet jest tutaj.
    # connect-src: WebSocket planu sali (blok G) idzie na ten sam host i port co strona.
    # 'self' obejmuje ws:/wss: dopiero w CSP poziomu 3 — jawny ws://$http_host działa też w starszych przeglądarkach.
    # Stripe (blok H3), lista z dokumentacji Stripe'a (Integration security guide, sekcja CSP):
    #   script-src  js.stripe.com, *.js.stripe.com — Stripe.js (ładowany tylko na ekranie płatności),
    #   frame-src   js.stripe.com, *.js.stripe.com — ramki Payment Element; hooks.stripe.com — 3-D Secure,
    #   connect-src api.stripe.com — potwierdzenie płatności z Stripe.js,
    #   link.com, *.link.com (frame, connect, img) — Link, włączony na koncie (rozpoznanie H).
    # Bez maps.googleapis.com: nie używamy Address Element. Bez 'unsafe-inline'.
    # Firebase Cloud Messaging (blok L), adresy z kodu @firebase/messaging i @firebase/installations:
    #   connect-src firebaseinstallations.googleapis.com — identyfikator instalacji,
    #               fcmregistrations.googleapis.com — rejestracja subskrypcji push i token FCM.
    # Samo powiadomienie przychodzi przez usługę push przeglądarki do service workera — poza CSP strony.
    location = /index.html {
        root /var/www/frontend/dist;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; style-src 'self'; img-src 'self' data: blob: https://*.link.com; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host https://api.stripe.com https://link.com https://*.link.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://link.com https://*.link.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        include /etc/nginx/cinema/hsts.conf;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Forward PHP scripts to the php-fpm container.
    # "php" is the compose service name, 9000 is the default FPM port.
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Etap 10, blok E: nginx jest brzegiem stosu, więc nagłówki X-Forwarded-* od klienta
        # zastępuje własną wiedzą (parametr FastCGI o tej samej nazwie wypiera nagłówek — ten sam
        # mechanizm co ochrona przed httpoxy). Laravel ufa im tylko z adresów z TRUSTED_PROXIES
        # (domyślnie żadnych), ale gdyby ktoś dopisał tam sieć Dockera, klient nie podszyje się
        # pod inne IP (limity po IP) ani pod HTTPS. Schemat i tak przychodzi jako HTTPS=on
        # z fastcgi_params.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_PROXY "";
    }

    # Deny access to dotfiles (.env, .git), except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
