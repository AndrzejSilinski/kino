# nginx obrazu produkcyjnego (Etap 10, blok F2): HTTP tylko przekierowuje na HTTPS, HTTPS z HSTS.
# Treść serwisu wspólna z dev (cinema.conf); SPA i statyczne pliki backend/public są w obrazie,
# plakaty (/storage/) z wolumenu wspólnego z kontenerami PHP (docker/prod/compose.yml).
# Certyfikat: docker/prod/certs/ na serwerze (np. z certbota) — bez niego kontener się nie uruchomi
# (tls.sh z CINEMA_TLS_WYMAGANY=1: w produkcji nie ma samopodpisanego zastępstwa).

server {
    listen 80;
    server_name _;
    # Weryfikacja domeny przez ACME (certbot --webroot) zostaje możliwa po HTTP.
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cinema_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    server_tokens off;

    include /etc/nginx/cinema/app.conf;
}
