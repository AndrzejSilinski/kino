server {
    listen 80;
    server_name localhost;

    # Laravel exposes ONLY the public/ directory to the outside world.
    # Application code and .env live one level up, out of reach.
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Any URL that is not an existing file is handed to index.php,
    # which is what makes Laravel routing work (/api/screenings etc).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Forward PHP scripts to the php-fpm container.
    # "php" is the compose service name, 9000 is the default FPM port.
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to dotfiles (.env, .git), except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
