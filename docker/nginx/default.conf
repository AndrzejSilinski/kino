# nginx stosu deweloperskiego (Etap 10, blok E): dwa serwery z tą samą treścią (cinema.conf).
#
#   :80  -> http://localhost:8080   jak dotąd: aplikacja mobilna przez "adb reverse" i curl w skryptach,
#   :443 -> https://localhost:8443  TLS 1.2/1.3, HTTP/2; wss:// dla WebSocketu, bezpieczny kontekst
#                                   przeglądarki (Web Push, service worker) także poza localhost.
#
# Bez przekierowania HTTP -> HTTPS i bez HSTS w środowisku deweloperskim: HSTS dotyczy całego hosta
# (bez portu), więc przeglądarka zaczęłaby zamieniać http://localhost:8080 na https://localhost:8080
# — i aplikacja mobilna, i każdy inny projekt na localhost przestałyby działać. W produkcji za TLS:
# przekierowanie z :80 i Strict-Transport-Security (README, Etap 10).
#
# Certyfikat: /etc/nginx/tls/ przygotowuje przy starcie /docker-entrypoint.d/05-cinema-tls.sh
# (docker/nginx/tls.sh) — własny z docker/nginx/certs/ (np. mkcert), a bez niego samopodpisany.

server {
    listen 80;
    server_name localhost;

    include /etc/nginx/cinema/app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cinema_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    include /etc/nginx/cinema/app.conf;
}
