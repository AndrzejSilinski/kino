; Obraz produkcyjny (Etap 10, blok D): pula PHP-FPM widzi zmienne środowiskowe kontenera.
; Domyślne clear_env = yes czyści je w procesach roboczych, a w produkcji konfiguracja przychodzi
; ze środowiska (sekrety, adresy usług), nie z pliku .env. Entrypoint i tak buduje cache konfiguracji
; (php artisan optimize), ale funkcja env() poza plikami config/ widziałaby wtedy pustkę.
[www]
clear_env = no
