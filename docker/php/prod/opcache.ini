; Obraz produkcyjny (Etap 10, blok D): kod jest wpieczony i niezmienny, więc OPcache nie sprawdza
; dat plików przy każdym żądaniu. Nowy kod = nowy obraz = nowy proces, który zaczyna od pustego cache.
; W obrazie dev ten plik nie występuje: tam kod pochodzi z bind mountu i zmienia się na bieżąco.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
