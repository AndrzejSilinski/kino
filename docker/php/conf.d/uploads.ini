; Etap 7, blok F — limity wysyłania plików (plakaty filmów w panelu).
;
; Od Etapu 10 (blok D) plik jest KOPIOWANY do obrazu (docker/php/Dockerfile, etap base) jako
; /usr/local/etc/php/conf.d/zz-uploads.ini — w obrazie dev i prod, dla php-fpm i CLI (worker,
; scheduler, reverb, artisan). Prefiks "zz-" = wczytany po plikach rozszerzeń.
; Wcześniej był montowany jako pojedynczy plik; montaż pliku z WSL to jedno z miejsc, w których
; start kontenera kończył się kodem 127 po restarcie Dockera (pułapka ET).
;
; Aplikacja przyjmuje plakat do 5 MB (reguła max:5120). PHP ma zapas powyżej
; tej granicy: plik 6 MB dojdzie do Laravela i dostanie polski komunikat
; walidacji, zamiast zostać po cichu odrzucony przez PHP jeszcze przed aplikacją.
; nginx ma client_max_body_size 20M, więc to PHP jest najwęższym gardłem.
;
; Po KAŻDEJ zmianie tego pliku: docker compose up -d --build --force-recreate php worker scheduler reverb,
; a potem docker compose restart nginx (fastcgi_pass php:9000 rozwiązuje adres kontenera php
; tylko przy starcie nginx, pułapka BJ). Bez --build kontenery dostałyby stary obraz.

upload_max_filesize = 8M
post_max_size = 10M
