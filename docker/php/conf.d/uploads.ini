; Etap 7, blok F — limity wysyłania plików (plakaty filmów w panelu).
;
; Plik jest podpięty w docker-compose.yml jako /usr/local/etc/php/conf.d/zz-uploads.ini
; we wszystkich kontenerach z obrazem cinema/php:dev (php-fpm i CLI: worker,
; scheduler, reverb, artisan). Prefiks "zz-" = wczytany po plikach rozszerzeń.
;
; Aplikacja przyjmuje plakat do 5 MB (reguła max:5120). PHP ma zapas powyżej
; tej granicy: plik 6 MB dojdzie do Laravela i dostanie polski komunikat
; walidacji, zamiast zostać po cichu odrzucony przez PHP jeszcze przed aplikacją.
; nginx ma client_max_body_size 20M, więc to PHP jest najwęższym gardłem.
;
; Po KAŻDEJ zmianie tego pliku: docker compose up -d --force-recreate php worker scheduler reverb,
; a potem docker compose restart nginx. Sam restart nie wystarczy: podpięty pojedynczy
; plik jest związany z i-węzłem, a edytory, sed -i i git checkout zapisują NOWY plik,
; więc działający kontener widziałby dalej starą treść. Restart nginx: fastcgi_pass php:9000
; rozwiązuje adres kontenera php tylko przy starcie nginx.

upload_max_filesize = 8M
post_max_size = 10M
