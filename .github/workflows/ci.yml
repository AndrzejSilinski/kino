# CI (Etap 10, blok F): te same narzędzia, którymi sprawdzany jest każdy blok lokalnie — tools/frontend/npm.sh,
# tools/flutter/flutter.sh, docker compose z entrypointem i sonda tools/realtime-probe/run.sh — więc
# "przechodzi u mnie" i "przechodzi w CI" znaczą to samo.
#
# Zadania:
#   sekrety  gitleaks na CAŁEJ historii (repozytorium jest publiczne), reguły z .gitleaks.toml
#   front    npm ci, audit (strażnik: zależności produkcyjne, high), typecheck, Vitest, build
#   mobile   pub get z lockfile, format, analyze --fatal-infos, flutter test
#   backend  docker compose z czystego klonu (entrypoint: .env, klucze, composer, migracje, dane
#            demonstracyjne), PHPUnit, sonda WebSocket przez nginx i Reverb, zgodność README z kodem
#            — z raportami Vitest i Fluttera z zadań front i mobile
#
# Akcje przypięte po SHA commita (tag można przesunąć — ta sama zasada co digesty obrazów, pułapka W);
# w komentarzu wersja, z której pochodzi SHA. Obrazy Dockera przypięte po digeście w skryptach.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sekrety:
    name: Sekrety w historii (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (git, cała historia, wartości zakryte)
        run: |
          docker run --rm -v "$PWD":/repo:ro -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact -v -c /repo/.gitleaks.toml

  front:
    name: Frontend (Vue)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: npm ci (dokładnie z package-lock.json, bez skryptów instalacyjnych)
        run: sh tools/frontend/npm.sh ci --ignore-scripts
      - name: npm audit (zależności produkcyjne, próg high)
        run: sh tools/frontend/npm.sh audit --omit=dev --audit-level=high
      - name: typecheck
        run: sh tools/frontend/npm.sh run typecheck
      - name: Vitest (raport JSON dla sprawdzacza README)
        run: |
          mkdir -p frontend/node_modules/.cache/testy
          sh tools/frontend/npm.sh exec --no -- vitest run --reporter=default --reporter=json \
            --outputFile.json=node_modules/.cache/testy/vitest.json
      - name: build
        run: sh tools/frontend/npm.sh run build
      # upload-artifact pomija pliki w katalogach zaczynających się od kropki (.cache) — po cichu.
      - name: Raport do zwykłego katalogu
        run: mkdir -p raporty-ci && cp frontend/node_modules/.cache/testy/vitest.json raporty-ci/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raport-vitest
          path: raporty-ci/vitest.json
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Aplikacja mobilna (Flutter)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Obraz Fluttera z Android SDK (ok. 3 GB) i dwa wolumeny z kopią SDK nie mieszczą się obok
      # preinstalowanego Android SDK runnera, którego nie używamy (budujemy w przypiętym obrazie).
      - name: Miejsce na dysku
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obraz i wolumeny Fluttera
        run: sh tools/flutter/flutter.sh --przygotuj
      - name: pub get (dokładnie z pubspec.lock)
        run: sh tools/flutter/flutter.sh pub get --enforce-lockfile
      - name: dart format (bez zmian)
        run: sh tools/flutter/flutter.sh dart format --output=none --set-exit-if-changed lib test
      - name: flutter analyze --fatal-infos
        run: sh tools/flutter/flutter.sh analyze --fatal-infos
      - name: flutter test (raport JSON dla sprawdzacza README)
        run: |
          mkdir -p mobile/build/testy
          timeout 900 sh tools/flutter/flutter.sh test --machine > mobile/build/testy/test.json
      - name: Raport do zwykłego katalogu
        if: always()
        run: |
          mkdir -p raporty-ci
          if [ -f mobile/build/testy/test.json ]; then cp mobile/build/testy/test.json raporty-ci/; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raport-flutter
          path: raporty-ci/test.json
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend, sonda WebSocket, README
    needs: [front, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Czysty klon, bez backend/.env: "Uruchomienie od zera" z README — jedno polecenie.
      # --wait czeka na healthcheck php (entrypoint: composer, migracje, dane demonstracyjne).
      - name: docker compose up (obrazy z repozytorium, entrypoint)
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: GET /up
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/up)" = 200
      - name: PHPUnit
        run: docker compose exec -T -u "$(id -u):$(id -g)" -e HOME=/tmp php php artisan test
      - name: Sonda WebSocket (nginx, Reverb, zdarzenia blokady i rezerwacji)
        run: bash tools/realtime-probe/run.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: raporty-ci
      - name: Raporty z front i mobile na miejsca, które czyta sprawdzacz
        run: |
          mkdir -p frontend/node_modules/.cache/testy mobile/build/testy
          cp raporty-ci/raport-vitest/vitest.json frontend/node_modules/.cache/testy/vitest.json
          cp raporty-ci/raport-flutter/test.json mobile/build/testy/test.json
      - name: Zgodność README z kodem (wszystkie sekcje i żywa tabela testów)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work -w /work cinema/php:dev \
            php tools/readme-compliance/check.php
      - name: Logi kontenerów po porażce
        if: failure()
        run: docker compose logs --no-color --tail 150
